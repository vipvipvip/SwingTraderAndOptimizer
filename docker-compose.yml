services:
  postgres:
    image: postgres:16-alpine
    container_name: swingtrader-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swingtrader"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      POSTGRES_DB: swingtrader
      POSTGRES_USER: swingtrader
      POSTGRES_PASSWORD: swingtrader_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ./swingtrader/backend/postgres_data:/var/lib/postgresql/data
      - ./swingtrader/backend/postgres_init:/docker-entrypoint-initdb.d
